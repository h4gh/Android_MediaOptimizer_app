name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK and run unit tests
        run: ./gradlew testDebugUnitTest assembleDebug -PversionCode=${{ github.run_number }}

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MediaOptimizer-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediaOptimizer-${{ github.run_number }}
          path: MediaOptimizer-${{ github.run_number }}.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }} (${{ github.ref_name }})
          body: "Test build from commit ${{ github.sha }}. Download the APK below and install it on the phone."
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: MediaOptimizer-${{ github.run_number }}.apk
